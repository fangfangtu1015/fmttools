<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The four audit gates between a CSV export and a destination table</title>
  <desc id="d">Four panels left to right: the source file as written bytes, the audit that describes delimiter, typing, structure and precision findings, the typed intermediate document, and the load plus reconciliation step that compares row counts and per-column digests before and after.</desc>
  <defs>
    <style>
      .h { font: 700 30px/1 inherit; fill: #0f172a }
      .k { font: 700 15px/1 inherit; fill: #1d4ed8; letter-spacing: .08em }
      .b { font: 400 16px/1 inherit; fill: #334155 }
      .m { font: 500 15px/1 inherit; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
      .ms { font: 500 13px/1 inherit; fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
      .w { font: 700 13px/1 inherit; fill: #b45309 }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 14 }
      .chip { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8 }
      .tint { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; rx: 10 }
      .warn { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 10 }
      .line { stroke: #cbd5e1; stroke-width: 2; fill: none }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#ah) }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#f8fafc" />

  <text x="40" y="52" class="h">Four gates between an export and a production table</text>
  <text x="40" y="82" class="b">Every value that changes on the way in is changed at gate 2 or gate 3. Audit before you transform, and reconcile after you load.</text>

  <!-- gate 1 -->
  <rect x="40" y="112" width="250" height="360" class="card" />
  <text x="60" y="150" class="k">1 · SOURCE FILE</text>
  <rect x="60" y="166" width="210" height="150" class="tint" />
  <text x="72" y="188" class="ms">id,zip,pan,at,note,</text>
  <text x="72" y="208" class="ms">1,00123,4111111111111111,</text>
  <text x="72" y="226" class="ms">2024-03-01 09:30,"a,b",</text>
  <text x="72" y="246" class="ms">2,00124,1234567890123456,</text>
  <text x="72" y="264" class="ms">13/04/2024,,</text>
  <text x="72" y="292" class="ms">long rows wrapped to</text>
  <text x="72" y="308" class="ms">fit this panel</text>
  <text x="60" y="340" class="ms">Bytes on disk, not rows.</text>
  <text x="60" y="360" class="ms">Encoding, line endings</text>
  <text x="60" y="380" class="ms">and quoting are still</text>
  <text x="60" y="400" class="ms">undecided here.</text>
  <rect x="60" y="414" width="210" class="warn" height="42" />
  <text x="72" y="432" class="w">Header has 6 fields;</text>
  <text x="72" y="450" class="w">rows 2 and 3 have 5.</text>

  <!-- gate 2 -->
  <rect x="335" y="112" width="250" height="360" class="card" />
  <text x="355" y="150" class="k">2 · AUDIT</text>
  <rect x="355" y="166" width="210" height="30" class="chip" />
  <text x="366" y="186" class="ms">delimiter: comma, 62%</text>
  <rect x="355" y="202" width="210" height="30" class="chip" />
  <text x="366" y="222" class="ms">ragged rows: 2 of 3</text>
  <rect x="355" y="238" width="210" height="30" class="chip" />
  <text x="366" y="258" class="ms">zip: string, keeps 0</text>
  <rect x="355" y="274" width="210" height="30" class="chip" />
  <text x="366" y="294" class="ms">pan: 16 digits, string</text>
  <rect x="355" y="310" width="210" height="30" class="chip" />
  <text x="366" y="330" class="ms">blank header, column_6</text>
  <rect x="355" y="352" width="210" height="58" class="warn" />
  <text x="366" y="372" class="w">Nothing is rewritten at</text>
  <text x="366" y="390" class="w">this gate. Findings,</text>
  <text x="366" y="406" class="w">not fixes.</text>
  <text x="355" y="436" class="ms">Decide one type per</text>
  <text x="355" y="456" class="ms">column, in writing.</text>

  <!-- gate 3 -->
  <rect x="630" y="112" width="250" height="360" class="card" />
  <text x="650" y="150" class="k">3 · TRANSFORM</text>
  <rect x="650" y="166" width="210" height="150" class="tint" />
  <text x="662" y="190" class="ms">{ "id": 1,</text>
  <text x="662" y="210" class="ms">  "zip": "00123",</text>
  <text x="662" y="230" class="ms">  "pan":</text>
  <text x="662" y="250" class="ms">   "4532015112830366",</text>
  <text x="662" y="270" class="ms">  "ts": "2024-03-01T09:30",</text>
  <text x="662" y="290" class="ms">  "note": "a,b",</text>
  <text x="662" y="310" class="ms">  "column_6": "" }</text>
  <text x="650" y="340" class="ms">Identifiers stay quoted</text>
  <text x="650" y="360" class="ms">text. Only cells that</text>
  <text x="650" y="380" class="ms">match the JSON number</text>
  <text x="650" y="400" class="ms">grammar become numbers.</text>
  <rect x="650" y="414" width="210" height="42" class="warn" />
  <text x="662" y="432" class="w">Empty cells become null,</text>
  <text x="662" y="450" class="w">not "", unless you stop it.</text>

  <!-- gate 4 -->
  <rect x="925" y="112" width="250" height="360" class="card" />
  <text x="945" y="150" class="k">4 · LOAD + RECONCILE</text>
  <rect x="945" y="166" width="210" height="120" class="chip" />
  <text x="957" y="188" class="ms">rows in    1,204,880</text>
  <text x="957" y="208" class="ms">rows out   1,204,880</text>
  <text x="957" y="228" class="ms">sum(id)    match</text>
  <text x="957" y="248" class="ms">md5(zip)   match</text>
  <text x="957" y="268" class="ms">null count match</text>
  <text x="945" y="312" class="ms">Compare the source and</text>
  <text x="945" y="332" class="ms">the destination, never</text>
  <text x="945" y="352" class="ms">the two files you wrote.</text>
  <rect x="945" y="370" width="210" height="58" class="warn" />
  <text x="957" y="390" class="w">Keep the source file,</text>
  <text x="957" y="408" class="w">the audit report and the</text>
  <text x="957" y="424" class="w">type notes for rollback.</text>

  <path d="M290 292 H335" class="arrow" />
  <path d="M585 292 H630" class="arrow" />
  <path d="M880 292 H925" class="arrow" />
  <text x="300" y="500" class="ms">parse</text>
  <text x="596" y="500" class="ms">typed pass</text>
  <text x="890" y="500" class="ms">insert</text>
  <text x="40" y="500" class="ms">gate</text>
</svg>
